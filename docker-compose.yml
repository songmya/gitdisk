version: "3.8"

services:
  gitdisk:
    build: .
    image: gitdisk:latest
    container_name: gitdisk
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/api/stats || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
